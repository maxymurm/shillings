<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>Offline - Shillings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #18181b;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 0.75rem;
        }
        p {
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #059669; }
        .offline-features {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #27272a;
            border-radius: 0.75rem;
            text-align: left;
        }
        .offline-features h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
            margin-bottom: 0.75rem;
        }
        .offline-features ul {
            list-style: none;
            padding: 0;
        }
        .offline-features li {
            padding: 0.375rem 0;
            color: #a1a1aa;
            font-size: 0.875rem;
        }
        .offline-features li::before {
            content: '✓ ';
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Don't worry — your data is saved locally. Any changes you make will sync automatically when you're back online.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        <div class="offline-features">
            <h3>Available Offline</h3>
            <ul>
                <li>View cached accounts & transactions</li>
                <li>Create new transactions (queued for sync)</li>
                <li>Browse cached contacts</li>
                <li>View recent reports</li>
            </ul>
        </div>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
